<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101226">
  <title>Gallery | Hello, World!</title>
  <style>
    :root { color-scheme:dark; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; --ink:#f8f7ff; --muted:#b7b5d2; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:flex; flex-direction:column; color:var(--ink); background:radial-gradient(ellipse at 18% 18%,#5240a64d,transparent 35%),radial-gradient(ellipse at 82% 78%,#0f9eaa38,transparent 34%),#101226; }
    .glow { position:fixed; z-index:-1; width:28rem; height:28rem; border-radius:50%; background:linear-gradient(135deg,#9b78ff,#39d9d0); filter:blur(100px); opacity:.2; top:18%; left:35%; }
    nav { width:min(1100px,90vw); margin:1.5rem auto 0; display:flex; align-items:center; justify-content:space-between; }
    .brand { color:var(--ink); text-decoration:none; font-weight:750; letter-spacing:-.04em; }
    .links { display:flex; gap:.4rem; }
    .links a { padding:.65rem .9rem; border-radius:10px; color:var(--muted); text-decoration:none; font-size:.9rem; transition:color .2s,background .2s; }
    .links a:hover,.links a[aria-current="page"] { color:var(--ink); background:#ffffff12; }
    main { position:relative; width:min(1100px,90vw); margin:clamp(2rem,6vh,4rem) auto; padding:clamp(2rem,5vw,3.5rem); border:1px solid #ffffff24; border-radius:30px; background:linear-gradient(145deg,#ffffff12,#ffffff05); box-shadow:0 28px 90px #0005,inset 0 1px #ffffff20; backdrop-filter:blur(18px); animation:arrive .8s ease both; }
    .eyebrow { margin:0 0 1rem; color:#d4cff5; font-size:.75rem; font-weight:650; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(3rem,8vw,5.5rem); line-height:1; letter-spacing:-.075em; }
    h1 span { color:transparent; background:linear-gradient(100deg,#a78bfa 15%,#68d7dc 85%); background-clip:text; -webkit-background-clip:text; }
    .intro { max-width:38rem; margin:1.2rem 0 2.2rem; color:var(--muted); font-size:1.05rem; line-height:1.75; }
    .gallery { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; }
    figure { min-height:250px; margin:0; display:flex; flex-direction:column; justify-content:flex-end; overflow:hidden; position:relative; padding:1.25rem; border:1px solid #ffffff20; border-radius:20px; isolation:isolate; background:#242444; transition:transform .25s ease,border-color .25s ease; }
    figure:hover { transform:translateY(-5px); border-color:#ffffff55; }
    figure::before { content:""; position:absolute; z-index:-1; inset:0; transition:transform .5s ease; }
    figure:hover::before { transform:scale(1.06); }
    figure:nth-child(1)::before { background:radial-gradient(ellipse at 25% 25%,#fff8 0 1%,transparent 24%),linear-gradient(145deg,#fa9b80,#ac5bd3 52%,#392e73); }
    figure:nth-child(2)::before { background:radial-gradient(ellipse at 70% 25%,#fff9 0 1%,transparent 20%),linear-gradient(150deg,#82e5d2,#4297b7 48%,#263466); }
    figure:nth-child(3)::before { background:radial-gradient(ellipse at 50% 35%,#fff9 0 1%,transparent 19%),linear-gradient(145deg,#f4c979,#e47d78 50%,#683d83); }
    figure:nth-child(4)::before { background:radial-gradient(ellipse at 28% 32%,#fff8 0 1%,transparent 24%),linear-gradient(145deg,#b7e59b,#51a989 52%,#285970); }
    figure:nth-child(5)::before { background:radial-gradient(ellipse at 70% 28%,#fff9 0 1%,transparent 22%),linear-gradient(145deg,#f7a8bf,#c165a9 52%,#55458d); }
    figure:nth-child(6)::before { background:radial-gradient(ellipse at 45% 25%,#fff9 0 1%,transparent 20%),linear-gradient(145deg,#8cbbf1,#656cc4 52%,#332c65); }
    figcaption { color:white; font-size:1.05rem; font-weight:700; text-shadow:0 2px 12px #0009; }
    figcaption small { display:block; margin-top:.3rem; color:#ffffffcc; font-size:.8rem; font-weight:450; }
    .footnote { margin:1.7rem 0 0; color:#8f8da9; font-size:.78rem; letter-spacing:.04em; }
    @keyframes arrive { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
    @media(max-width:760px) { .gallery { grid-template-columns:repeat(2,1fr); } figure { min-height:210px; } }
    @media(max-width:480px) { nav { margin-top:1rem; } .links { gap:0; } .links a { padding:.6rem .45rem; font-size:.78rem; } main { padding:2rem 1.2rem; } .gallery { gap:.65rem; } figure { min-height:170px; padding:.85rem; border-radius:15px; } figcaption { font-size:.92rem; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <nav aria-label="Main navigation"><a class="brand" href="index.html">✦ Hello World</a><div class="links"><a href="index.html">Home</a><a href="about.html">About</a><a href="gallery.html" aria-current="page">Gallery</a><a href="contact.html">Contact</a></div></nav>
  <main>
    <p class="eyebrow">A few colorful moments</p>
    <h1>Little <span>wonders.</span></h1>
    <p class="intro">A collection of bright colors and daydreams to explore. Pick a favorite, take a pause, and enjoy the view.</p>
    <section class="gallery" aria-label="Colorful abstract gallery">
      <figure><figcaption>Golden hour<small>Warmth in every corner</small></figcaption></figure>
      <figure><figcaption>Clear skies<small>A breath of fresh air</small></figcaption></figure>
      <figure><figcaption>Soft sunrise<small>A new day unfolding</small></figcaption></figure>
      <figure><figcaption>Wild garden<small>Growing at its own pace</small></figcaption></figure>
      <figure><figcaption>Daydream<small>A little room to wander</small></figcaption></figure>
      <figure><figcaption>Blue hour<small>When the world slows down</small></figcaption></figure>
    </section>
    <p class="footnote">Color your world ✦</p>
  </main>
</body>
</html>
