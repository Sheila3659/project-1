<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101226">
  <title>Hello, World!</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ink: #f8f7ff;
      --muted: #b7b5d2;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 18% 18%, #5240a64d, transparent 35%),
        radial-gradient(ellipse at 82% 78%, #0f9eaa38, transparent 34%),
        #101226;
    }

    nav {
      position: relative;
      z-index: 1;
      width: min(1100px, 90vw);
      margin: 1.5rem auto 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { color: var(--ink); text-decoration: none; font-weight: 750; letter-spacing: -.04em; }
    .links { display: flex; gap: .4rem; }
    .links a { padding: .65rem .9rem; border-radius: 10px; color: var(--muted); text-decoration: none; font-size: .9rem; transition: color .2s, background .2s; }
    .links a:hover, .links a[aria-current="page"] { color: var(--ink); background: #ffffff12; }
    main { margin: auto; }
    @media (max-width: 480px) { nav { margin-top: 1rem; } .links { gap: 0; } .links a { padding: .6rem .55rem; font-size: .82rem; } }

    .glow {
      position: fixed;
      width: 28rem;
      height: 28rem;
      border-radius: 50%;
      background: linear-gradient(135deg, #9b78ff, #39d9d0);
      filter: blur(100px);
      opacity: .2;
      animation: drift 12s ease-in-out infinite alternate;
      pointer-events: none;
    }

    main {
      position: relative;
      width: min(90vw, 760px);
      padding: clamp(2.5rem, 8vw, 5.5rem) clamp(1.5rem, 7vw, 5rem);
      text-align: center;
      border: 1px solid #ffffff24;
      border-radius: 30px;
      background: linear-gradient(145deg, #ffffff12, #ffffff05);
      box-shadow: 0 28px 90px #0005, inset 0 1px #ffffff20;
      backdrop-filter: blur(18px);
      animation: arrive .9s cubic-bezier(.2,.8,.2,1) both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      margin: 0 0 1.5rem;
      padding: .55rem .9rem;
      border: 1px solid #ffffff1c;
      border-radius: 999px;
      color: #d4cff5;
      background: #ffffff09;
      font-size: .75rem;
      font-weight: 650;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .dot {
      width: .45rem;
      height: .45rem;
      border-radius: 50%;
      background: #52e5c1;
      box-shadow: 0 0 12px #52e5c1;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.2rem, 11vw, 7rem);
      line-height: .98;
      letter-spacing: -.075em;
    }

    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(100deg, #a78bfa 15%, #68d7dc 85%);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .subtitle {
      max-width: 34rem;
      margin: 1.6rem auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.75;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      margin-top: 2.25rem;
      padding: .9rem 1.25rem;
      border: 1px solid #ffffff26;
      border-radius: 14px;
      color: #fff;
      background: #ffffff10;
      font: inherit;
      font-size: .92rem;
      font-weight: 650;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }

    .button:hover { transform: translateY(-3px); background: #ffffff1a; border-color: #ffffff55; }
    .button:focus-visible { outline: 3px solid #9b8aff; outline-offset: 4px; }
    .button svg { width: 1rem; height: 1rem; }

    .footnote { margin: 2rem 0 0; color: #8f8da9; font-size: .78rem; letter-spacing: .04em; }

    @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes drift { to { transform: translate(12vw, -8vh) scale(1.15); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <nav aria-label="Main navigation">
    <a class="brand" href="index.html">✦ Hello World</a>
    <div class="links"><a href="index.html" aria-current="page">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a></div>
  </nav>
  <main>
    <p class="eyebrow"><span class="dot" aria-hidden="true"></span> A little something to start</p>
    <h1>Hello,<span>World!</span></h1>
    <p class="subtitle">A fresh page, a bright idea, and a whole world of possibilities. Here’s to making something wonderful.</p>
    <button class="button" id="helloButton" type="button">
      Say hello
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10h11m-4-4 4 4-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <p class="footnote">Made with a little extra sparkle ✦</p>
  </main>
  <script>
    const button = document.querySelector('#helloButton');
    button.addEventListener('click', () => {
      button.innerHTML = 'Hello right back! <span aria-hidden="true">✦</span>';
    });
  </script>
</body>
</html>
