<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101226">
  <title>Contact | Hello, World!</title>
  <style>
    :root { color-scheme:dark; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; --ink:#f8f7ff; --muted:#b7b5d2; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:flex; flex-direction:column; color:var(--ink); background:radial-gradient(ellipse at 18% 18%,#5240a64d,transparent 35%),radial-gradient(ellipse at 82% 78%,#0f9eaa38,transparent 34%),#101226; }
    .glow { position:fixed; z-index:-1; width:28rem; height:28rem; border-radius:50%; background:linear-gradient(135deg,#9b78ff,#39d9d0); filter:blur(100px); opacity:.2; top:20%; right:15%; }
    nav { width:min(1100px,90vw); margin:1.5rem auto 0; display:flex; align-items:center; justify-content:space-between; }
    .brand { color:var(--ink); text-decoration:none; font-weight:750; letter-spacing:-.04em; }
    .links { display:flex; gap:.4rem; }
    .links a { padding:.65rem .9rem; border-radius:10px; color:var(--muted); text-decoration:none; font-size:.9rem; transition:color .2s,background .2s; }
    .links a:hover,.links a[aria-current="page"] { color:var(--ink); background:#ffffff12; }
    main { position:relative; width:min(90vw,760px); margin:auto; padding:clamp(2.5rem,8vw,5rem); border:1px solid #ffffff24; border-radius:30px; background:linear-gradient(145deg,#ffffff12,#ffffff05); box-shadow:0 28px 90px #0005,inset 0 1px #ffffff20; backdrop-filter:blur(18px); animation:arrive .8s ease both; }
    .eyebrow { margin:0 0 1.2rem; color:#d4cff5; font-size:.75rem; font-weight:650; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(3rem,9vw,5.5rem); line-height:1; letter-spacing:-.075em; }
    h1 span { color:transparent; background:linear-gradient(100deg,#a78bfa 15%,#68d7dc 85%); background-clip:text; -webkit-background-clip:text; }
    .intro { max-width:38rem; margin:1.5rem 0 2rem; color:var(--muted); font-size:1.08rem; line-height:1.8; }
    form { display:grid; gap:1rem; }
    label { display:grid; gap:.5rem; color:#e5e2f6; font-size:.88rem; font-weight:600; }
    input,textarea { width:100%; padding:.9rem 1rem; border:1px solid #ffffff24; border-radius:12px; outline:none; color:var(--ink); background:#ffffff09; font:inherit; font-size:.95rem; transition:border-color .2s,background .2s; }
    input::placeholder,textarea::placeholder { color:#8f8da9; }
    input:focus,textarea:focus { border-color:#a78bfa; background:#ffffff0d; }
    textarea { min-height:130px; resize:vertical; }
    button { justify-self:start; display:inline-flex; align-items:center; gap:.65rem; padding:.9rem 1.2rem; border:1px solid #ffffff26; border-radius:12px; color:#fff; background:linear-gradient(110deg,#8065d8,#287f92); font:inherit; font-weight:650; cursor:pointer; transition:transform .2s,filter .2s; }
    button:hover { transform:translateY(-2px); filter:brightness(1.12); }
    button:focus-visible { outline:3px solid #9b8aff; outline-offset:4px; }
    #status { min-height:1.3em; margin:0; color:#8ee4cf; font-size:.9rem; }
    .footnote { margin:1.5rem 0 0; color:#8f8da9; font-size:.78rem; letter-spacing:.04em; }
    @keyframes arrive { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
    @media(max-width:480px) { nav { margin-top:1rem; } .links { gap:0; } .links a { padding:.6rem .55rem; font-size:.82rem; } main { padding:2.2rem 1.4rem; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <nav aria-label="Main navigation"><a class="brand" href="index.html">✦ Hello World</a><div class="links"><a href="index.html">Home</a><a href="about.html">About</a><a href="gallery.html">Gallery</a><a href="contact.html" aria-current="page">Contact</a></div></nav>
  <main>
    <p class="eyebrow">Your turn to say hello</p>
    <h1>Let’s <span>talk.</span></h1>
    <p class="intro">Have a thought, a question, or just want to say hi? Send a note below. We’d love to hear from you.</p>
    <form id="contactForm">
      <label for="name">Your name<input id="name" name="name" type="text" placeholder="What should we call you?" autocomplete="name" required></label>
      <label for="email">Email address<input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required></label>
      <label for="message">Your message<textarea id="message" name="message" placeholder="Write your note here..." required></textarea></label>
      <button type="submit">Send a hello <span aria-hidden="true">↗</span></button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <p class="footnote">A friendly note goes a long way ✦</p>
  </main>
  <script>
    document.querySelector('#contactForm').addEventListener('submit', (event) => {
      event.preventDefault();
      document.querySelector('#status').textContent = 'Thanks for your note! This demo form is ready to connect to an email service.';
    });
  </script>
</body>
</html>
